name: Validate

on:
  push:
    paths:
      - 'phpbb/**'
      - '.github/**'
  pull_request:
    paths:
      - 'phpbb/**'
      - '.github/**'

permissions:
  contents: read

jobs:
  phpbb:
    name: Validate phpBB version files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Validate phpbb/versions.json and phpbb/*.txt
        run: python .github/scripts/validate_phpbb.py
